name: Build OmniMail Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Ensure gradle.properties exists
        run: |
          if [ ! -f gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.nonTransitiveRClass=true" >> gradle.properties
            echo "android.disableMinCompileSdkCheck=true" >> gradle.properties
          fi

      - name: Build Debug APK
        run: gradle assembleDebug -Pandroid.disableMinCompileSdkCheck=true --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniMail-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
